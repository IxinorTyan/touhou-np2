<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>东方旧作</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="player-page">
  <main class="player-shell">
    <nav class="player-nav">
      <a href="index.html" id="back" class="nav-back">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span>全部作品</span>
      </a>
      <div class="player-nav-controls">
        <label class="setting-label">
          <span>CPU</span>
          <select id="clock" class="select-control">
            <option value="16">39 MHz（默认）</option>
            <option value="8">20 MHz</option>
            <option value="24">59 MHz</option>
            <option value="32">79 MHz</option>
          </select>
        </label>
      </div>
    </nav>

    <div class="player-header">
      <h1 id="title" class="game-heading">东方旧作</h1>
      <p id="subtitle" class="game-subheading"></p>
    </div>

    <div class="screen-wrapper">
      <div class="screen" id="screen">
        <canvas id="canvas" width="640" height="400" tabindex="0" aria-label="游戏画面"></canvas>
        <div id="cover" class="screen-cover">
          <div class="cover-content">
            <button id="start" class="btn-start" type="button">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <span>启动游戏</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-group">
        <button id="pause" class="btn-tool" disabled>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          <span>暂停</span>
        </button>
        <button id="reset" class="btn-tool" disabled>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span>重启</span>
        </button>
        <button id="fullscreen" class="btn-tool">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          <span>全屏</span>
        </button>
      </div>

      <div class="toolbar-group">
        <button id="export" class="btn-tool" disabled>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>导出存档</span>
        </button>
        <label class="btn-tool file-button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>导入存档</span>
          <input id="import" type="file" accept=".hdi" hidden>
        </label>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-left">
        <span class="status-dot" id="status-dot"></span>
        <span id="status" role="status" aria-live="polite">等待启动</span>
      </div>
      <div class="status-right">
        <span id="save-status"></span>
      </div>
    </div>

    <div class="player-shortcuts">
      <div class="shortcut-list">
        <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移动</span>
        <span><kbd>Z</kbd> 射击 / 确认</span>
        <span><kbd>X</kbd> 炸弹</span>
        <span><kbd>Esc</kbd> 暂停</span>
      </div>
      <div class="shortcut-hint">提示：请使用英文输入法；点击画面激活音频</div>
    </div>
  </main>
  <script type="module" src="player.js"></script>
</body>
</html>
